name: sandbox-image

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: sandbox-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/atlas-sandbox

jobs:
  publish:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: compute tag
        id: meta
        run: echo "sha_tag=sha-$(git rev-parse HEAD | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: packages/harness/sandbox-image
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.IMAGE }}:latest
          # Registry-backed cache, not type=gha: legacy CI proved the 10 GB gha
          # cache evicts its own Docker blobs, forcing cold builds.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  retag:
    # release-please tags tui releases as tui-vX.Y.Z (release-please-config.json,
    # include-component-in-tag); those are the only releases this repo cuts.
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'tui-v')
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: retag existing image
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#tui-v}"
          SHA_TAG="sha-$(echo "$RELEASE_SHA" | cut -c1-7)"
          if docker buildx imagetools inspect "${IMAGE}:${SHA_TAG}" >/dev/null 2>&1; then
            SOURCE_TAG="$SHA_TAG"
          else
            # A release-please merge commit touches only changelogs/manifests, so the
            # path-scoped publish job never built a sha tag for it; latest is the most
            # recent publish of the same context.
            SOURCE_TAG="latest"
          fi
          docker buildx imagetools create -t "${IMAGE}:${VERSION}" "${IMAGE}:${SOURCE_TAG}"
          echo "Tagged \`${IMAGE}:${VERSION}\` from \`${IMAGE}:${SOURCE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
