name: CI

on:
  push:
    branches: [main]
    # A docs-only push to main skips the whole workflow (and thus deploy.yml's
    # workflow_run) — no images to rebuild or deploy. Kept in sync with the `changes`
    # job's `code` filter so a push that touches any non-doc file always runs full CI.
    paths-ignore:
      - "**/*.md"
      - "**/*.mdx"
      - "docs/**"
      - "LICENSE"
  pull_request:

# Serialize by ref and drop superseded runs. A new commit on a PR cancels that PR's
# in-flight run; a new push to main cancels the running one, so only the newest main
# commit builds images and deploys (deploy fires only on CI success). Distinct refs
# (different PRs, main) get distinct groups and never cancel each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Change detection ──────────────────────────────────────────────────────────
  # On pull_request, a docs-only change sets code=false so the heavy jobs skip; the
  # push trigger already filters docs at the workflow level (paths-ignore above), so
  # a push here is always code-bearing. Globs mirror on.push.paths-ignore.
  changes:
    name: Detect changes
    runs-on: [self-hosted, atlas-box]
    # paths-filter reads the PR's changed-file list from the GitHub API, which needs
    # pull-requests:read (the repo's default GITHUB_TOKEN is restricted to contents:read).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - "**"
              - "!**/*.md"
              - "!**/*.mdx"
              - "!docs/**"
              - "!LICENSE"

  # ── Typecheck ─────────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: [self-hosted, atlas-box]
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          # Submodules are PUBLIC — no PAT needed; the default GITHUB_TOKEN checks them out.
          submodules: recursive

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Backend typecheck
        run: pnpm --filter backend typecheck

      - name: Backend CLI typecheck
        run: pnpm --filter backend typecheck:cli

  # ── Unit tests ────────────────────────────────────────────────────────────────
  # Runs as a single job: GitHub bills each job rounded up to the whole minute, so the
  # former 4-shard matrix (4 runners + 4× checkout/setup) cost far more billed minutes
  # than the suite's wall time saved. Vitest still parallelizes across the runner's cores.
  unit-tests:
    name: Unit tests
    runs-on: [self-hosted, atlas-box]
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Migration hygiene guard (backend/cli/migrations-hygiene.spec.ts) needs
          # origin/main resolvable to compute the merge-base diff of added migrations.
          fetch-depth: 0

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Unit tests
        run: pnpm --filter backend exec vitest run --mode unit

  # ── Integration tests ─────────────────────────────────────────────────────────
  integration-tests:
    name: Integration tests
    runs-on: [self-hosted, atlas-box]
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The runner pool is ~3 instances on one physical box sharing one Docker daemon, and
    # the Postgres service below binds a fixed host port (5433, matching .env.test.enc's
    # hardcoded coords). The workflow-level `concurrency` group is scoped per-ref, so two
    # different refs (two PRs, or a PR + main) can still schedule this job on the same box
    # at once and race on hostPort 5433. Serialize this job across the whole pool with a
    # ref-independent group so a second run queues instead of failing on "port already
    # allocated".
    concurrency:
      group: integration-tests-atlas-box
      cancel-in-progress: false
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: atlas
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U agent -d atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Integration tests
        env:
          DOTENV_PRIVATE_KEY_TEST_ENC: ${{ secrets.DOTENV_PRIVATE_KEY_TEST_ENC }}
        run: pnpm --filter backend exec vitest run --mode int

  # ── Aggregate gate ────────────────────────────────────────────────────────────
  # Single required status check. Named to match the existing branch-protection check
  # ("CI / Typecheck + unit tests") so the required check is stable across job changes.
  # Runs on every PR (even docs-only) so the required check always reports: a `skipped`
  # code job (docs-only change) is treated as passing; only a real `failure` blocks.
  ci-gate:
    name: Typecheck + unit tests
    runs-on: [self-hosted, atlas-box]
    needs: [typecheck, unit-tests, integration-tests]
    if: always()
    steps:
      - name: Require typecheck + unit tests to pass (or be skipped)
        run: |
          tc="${{ needs.typecheck.result }}"
          ut="${{ needs.unit-tests.result }}"
          it="${{ needs.integration-tests.result }}"
          [ "$tc" = "success" ] || [ "$tc" = "skipped" ] || exit 1
          [ "$ut" = "success" ] || [ "$ut" = "skipped" ] || exit 1
          [ "$it" = "success" ] || [ "$it" = "skipped" ] || exit 1

  # ── Build and push images ─────────────────────────────────────────────────────
  # Only runs on push to main (not PRs) and requires typecheck + unit tests + integration
  # tests to pass.
  build-images:
    name: Build + push Docker images
    runs-on: [self-hosted, atlas-box]
    needs: [typecheck, unit-tests, integration-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          # Submodules are PUBLIC — no PAT needed.
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          # Deterministic 7-char truncation of the full SHA — MUST match deploy.yml's
          # `cut -c1-7`. `git rev-parse --short` emits the shortest *unambiguous*
          # abbreviation (8+ chars when the 7-char prefix collides), which would tag the
          # image differently from the tag deploy.yml pulls → "image not found" deploys.
          SHA_TAG="sha-$(git rev-parse HEAD | cut -c1-7)"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "backend_image=ghcr.io/dennisofficial/atlas-backend" >> "$GITHUB_OUTPUT"
          echo "migrator_image=ghcr.io/dennisofficial/atlas-backend-migrator" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/dennisofficial/atlas-web" >> "$GITHUB_OUTPUT"
          echo "caddy_image=ghcr.io/dennisofficial/atlas-caddy" >> "$GITHUB_OUTPUT"

      - name: Check for sandbox image changes
        id: sandbox_check
        run: |
          # Detect if the sandbox image build context (backend/sandbox/**) changed in this
          # push — informational only (surfaced in the step summary); the backend
          # auto-rebuilds the image on a context-hash change at boot.
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q '^backend/sandbox/'; then
            echo "sandbox_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "sandbox_changed=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Backend runtime image ──────────────────────────────────────────────────
      - name: Build + push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/backend.Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.sha_tag }}
          tags: |
            ${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.backend_image }}:latest
          # Registry-backed layer cache (GHCR), NOT type=gha: the gha cache is capped at
          # 10 GB/repo and mode=max Docker blobs evicted themselves (and the pnpm cache),
          # forcing cold builds. A GHCR :buildcache tag has no such cap and persists.
          cache-from: type=registry,ref=${{ steps.meta.outputs.backend_image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.backend_image }}:buildcache,mode=max

      # ── Backend migrator image (--target migrator) ─────────────────────────────
      - name: Build + push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/backend.Dockerfile
          target: migrator
          push: true
          tags: |
            ${{ steps.meta.outputs.migrator_image }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.migrator_image }}:latest
          # Reads the backend buildcache too — the migrator is a stage of the same
          # backend.Dockerfile, so it reuses those already-cached layers.
          cache-from: |
            type=registry,ref=${{ steps.meta.outputs.migrator_image }}:buildcache
            type=registry,ref=${{ steps.meta.outputs.backend_image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.migrator_image }}:buildcache,mode=max

      # ── Web image ─────────────────────────────────────────────────────────────
      - name: Build + push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/web.Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_HTTP_URL=https://api.byatlas.io
            NEXT_PUBLIC_GIT_SHA=${{ steps.meta.outputs.sha_tag }}
          tags: |
            ${{ steps.meta.outputs.web_image }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.web_image }}:latest
          cache-from: type=registry,ref=${{ steps.meta.outputs.web_image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.web_image }}:buildcache,mode=max

      # ── Caddy image (stock caddy:2 + caddy-dns/cloudflare for the wildcard cert) ──
      - name: Build + push caddy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/caddy.Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.caddy_image }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.caddy_image }}:latest
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy

      - name: Summary
        run: |
          echo "### Images published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend:  \`${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.sha_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Migrator: \`${{ steps.meta.outputs.migrator_image }}:${{ steps.meta.outputs.sha_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web:      \`${{ steps.meta.outputs.web_image }}:${{ steps.meta.outputs.sha_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Caddy:    \`${{ steps.meta.outputs.caddy_image }}:${{ steps.meta.outputs.sha_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sandbox changed: ${{ steps.sandbox_check.outputs.sandbox_changed }}" >> "$GITHUB_STEP_SUMMARY"
