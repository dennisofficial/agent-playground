# PROD EARS — "Atlas" (Events API / HTTP only). The one event listener + fallback poster,
# OAuth-distributed (unlisted) and installed into every workspace.
display_information:
  name: Atlas
  description: "Relays your messages to Atlas."
features:
  bot_user:
    display_name: Atlas
    always_online: true
oauth_config:
  redirect_urls:
    - https://crew.dltechnologies.co/slack/oauth
  scopes:
    bot:
      - chat:write
      - chat:write.customize # fallback posting as employees (username/icon override)
      - reactions:write
      - files:write # plan snippets on approval cards (files.uploadV2)
      - channels:read
      - channels:history
      - channels:join
      - channels:manage # invite the team-lead puppet into public channels (join fallback)
      - groups:read
      - groups:history
      - groups:write # invite the team-lead puppet into private channels
      - users:read
settings:
  event_subscriptions:
    request_url: https://crew.dltechnologies.co/slack/events
    bot_events:
      - message.channels
      - message.groups
      - member_joined_channel
      - app_uninstalled
      - tokens_revoked
  interactivity:
    is_enabled: true
    request_url: https://crew.dltechnologies.co/slack/interactivity
  socket_mode_enabled: false
  org_deploy_enabled: false
