name: Set up workspace
description: >
  pnpm + Node, with the workspace-package dist restored from cache BEFORE install so
  pnpm's injectWorkspacePackages hardlinks it at install time; build:packages runs only
  on a cache miss. The `shared` package rebuilds itself via its `prepare` hook during
  install, so it needs no explicit build step here.

runs:
  using: composite
  steps:
    - name: Set up pnpm
      # No `version:` here — action-setup reads it from package.json's `packageManager`
      # field (single source of truth), so a pnpm bump can't desync the two.
      #
      # `dest` is isolated PER RUNNER. The self-hosted atlas-box runners run as one shared
      # OS user, so the default dest (`~/setup-pnpm`) is the SAME directory for every
      # runner instance. When two jobs (e.g. Typecheck + Unit tests) run concurrently they
      # both self-install pnpm into that one dir and race: one job's self-installer chdirs
      # into the dest while the other rewrites/removes it, so the loser dies with either
      # `ENOTEMPTY: ... rmdir '.../setup-pnpm'` or `ENOENT: process.cwd failed ... uv_cwd`
      # (pnpm/action-setup#149). RUNNER_TEMP is unique per runner instance AND wiped between
      # jobs, so keying dest to it gives every job a private, clean install dir — no shared
      # state, no cross-job race. No-op difference on ephemeral hosted runners.
      uses: pnpm/action-setup@v4
      with:
        dest: ${{ runner.temp }}/setup-pnpm

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "pnpm"

    - name: Restore built workspace packages (dist)
      id: dist
      # Restored BEFORE install: pnpm's injectWorkspacePackages hardlinks each package's
      # dist into dependents at install time, so a warm dist lets us skip build:packages.
      # The key hashes source only (dist does not exist yet at this point), so any change
      # to a package or the lockfile invalidates it. build:packages builds every workspace
      # package, so a cache that omitted a dist would leave it unbuilt on a hit and break
      # module resolution.
      uses: actions/cache@v4
      with:
        path: |
          packages/**/dist
        key: pkgs-dist-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/**') }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Build workspace packages
      # Only on a cache miss — on a hit the dist restored above is already injected.
      if: steps.dist.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm run build:packages
