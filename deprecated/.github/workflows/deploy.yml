name: Deploy to production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Serialize deploys: two main pushes in flight must not run two blue/green swaps concurrently against
# the box's shared state files. Don't cancel in-progress — let a running deploy finish cleanly.
concurrency:
  group: atlas-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Blue/green deploy
    # Only run when the CI workflow succeeded and we're on main.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    # Runs on the self-hosted runner installed on the production box.
    runs-on: [self-hosted, atlas-box]

    # GitHub Environment with required reviewer = Dennis.
    # Configure in: GitHub repo → Settings → Environments → production → Required reviewers.
    environment: production

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout (full)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full checkout (was sparse `infra` only): the atlas-box runners are shared with
          # CI, which needs a full checkout. actions/checkout@v4 does NOT clear a leftover
          # sparse cone, so a sparse deploy would pin the runner's _work and break the next
          # CI job's `.github/actions` resolution. Deploy only uses infra/, but a full
          # checkout keeps every runner's tree uniform. See infra/runner/README.md.

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: tag
        run: |
          SHA_TAG="sha-$(echo '${{ github.event.workflow_run.head_sha }}' | cut -c1-7)"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "Deploying tag: ${SHA_TAG}"

      - name: Detect sandbox image changes
        id: sandbox_check
        run: |
          # Check if the sandbox image build context changed in the deployed commit
          # compared to its parent — informational only (surfaced in the step summary);
          # the backend auto-rebuilds the image on a context-hash change at boot.
          git fetch origin "${{ github.event.workflow_run.head_sha }}" --depth=2 2>/dev/null || true
          if git diff --name-only \
              "${{ github.event.workflow_run.head_sha }}~1" \
              "${{ github.event.workflow_run.head_sha }}" 2>/dev/null \
              | grep -q '^backend/sandbox/'; then
            echo "sandbox_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "sandbox_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        id: deploy
        run: |
          chmod +x infra/deploy.sh
          infra/deploy.sh "${{ steps.tag.outputs.sha_tag }}"

      - name: Rollback on failure
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          PREV_TAG="$(cat /srv/atlas/state/active-tag 2>/dev/null || echo '')"
          if [[ -n "$PREV_TAG" && "$PREV_TAG" != "${{ steps.tag.outputs.sha_tag }}" ]]; then
            echo "Deploy failed. Rolling back to previous tag: ${PREV_TAG}"
            chmod +x infra/deploy.sh
            infra/deploy.sh --rollback "$PREV_TAG" || true
          else
            echo "No previous tag available for rollback — manual intervention required."
          fi

      - name: Summary
        if: always()
        run: |
          echo "### Deploy result" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`${{ steps.tag.outputs.sha_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sandbox context changed: ${{ steps.sandbox_check.outputs.sandbox_changed }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Outcome: ${{ steps.deploy.outcome }}" >> "$GITHUB_STEP_SUMMARY"
