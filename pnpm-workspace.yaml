packages:
  - packages/**
  - backend
  - shared
  - tui
  - web
# Everything that used to live under submodules/ is now published to npm under @dltech/*.
# pnpm 11 also uses this file as the workspace settings store:
#   - injectWorkspacePackages + nodeLinker: isolated — inject workspace packages the way `pnpm install`
#     would for external packages, so peerDependencies don't get duplicate runtime instances
#     (one @nestjs/* + one @langchain/core shared across backend and the submodule).
#   - allowBuilds: which dependency postinstall/build scripts may run (native deps need this)
#   - overrides:   force single instances / pin the workspace TS version
ignoreWorkspaceRootCheck: true
injectWorkspacePackages: true
nodeLinker: isolated
preferWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build
  - prepare
allowBuilds:
  '@nestjs/core': true
  '@node-rs/argon2': true
  '@prisma/engines': true
  prisma: true
  '@swc/core': true
  better-sqlite3: true
  cpu-features: false
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  ssh2: false
  unrs-resolver: true
  # The TUI runs on Bun: OpenTUI's renderer is a Zig native library reachable only through Bun's
  # FFI. Its postinstall fetches the runtime binary.
  bun: true
overrides:
  '@langchain/core': 1.1.48
  typescript: 6.0.3
  # packages/ai-testing (submodule) pins react@^18.3.1 + @types/react@^18.3.12; web uses 19.x. A full
  # workspace install resolves both, giving TypeScript two nominally different ReactNode types and
  # breaking `next build`'s type-check (e.g. providers.tsx's {children}). Force one instance workspace-
  # wide, same pattern as @langchain/core above — ai-testing doesn't render a real DOM tree, it's an
  # eval/test harness, so the react-19 types/runtime are compatible for its actual usage.
  react: 19.2.7
  react-dom: 19.2.7
  '@types/react': ^19
  '@types/react-dom': ^19
minimumReleaseAgeExclude:
  - '@tanstack/react-virtual@3.14.6'
  - '@tanstack/virtual-core@3.17.4'
  # First-party @dltech packages: the release-age gate exists to blunt a compromised
  # upstream release, which does not apply to a scope we publish ourselves — and pinning
  # each version here would mean a new entry on every release.
  - '@dltech/*'
