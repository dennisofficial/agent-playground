packages:
  - playground
# Workspace with one package today (`playground`); more land as the app is carved out of it.
# pnpm 11 also uses this file as the workspace settings store:
#   - allowBuilds: which dependency postinstall/build scripts may run (native deps need this)
#   - overrides:   force a single @langchain/core instance across @langchain/* packages
allowBuilds:
  esbuild: true
  better-sqlite3: true
overrides:
  '@langchain/core': 1.1.48
