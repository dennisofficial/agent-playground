# Local dev services. Postgres ships the pgvector extension (the harness's semantic memory needs it).
# Bring up: `docker compose up -d postgres`. Creds match backend/.env.personal.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent-playground-postgres
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent_playground
    # Logical replication is required by the in-process realtime engine (pg-realtime → live "needs you"
    # dots). The POSTGRES_USER ('agent') is the image superuser, which already carries the REPLICATION
    # attribute, so no extra role grant is needed.
    #   - max_wal_senders=20: headroom for dev hot-reload churn — `nest start --watch` restarts don't
    #     always close the old replication connection gracefully, so a few overlap before Postgres
    #     reclaims them.
    #   - wal_sender_timeout=10s (default 60s): reclaim a dead walsender (and free the slot) within 10s
    #     instead of a minute, so rapid reloads can't stack connections up to the cap.
    command:
      - postgres
      - '-c'
      - 'wal_level=logical'
      - '-c'
      - 'max_replication_slots=10'
      - '-c'
      - 'max_wal_senders=20'
      - '-c'
      - 'wal_sender_timeout=10s'
    ports:
      # Host 5433 (container stays 5432) so this project's Postgres runs alongside another project's
      # Postgres bound to the default 5432. POSTGRES_PORT in .env.local.enc/.env.test.enc matches 5433.
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent -d agent_playground']
      interval: 5s
      timeout: 5s
      retries: 10

  # The host↔daemon communication bus (Redis Streams/pub-sub). Host 6380 (container 6379) so it runs
  # alongside any personal Redis on the default 6379 — mirrors the Postgres 5433 choice. Workspace
  # sandboxes reach it by service DNS on this compose network; the host harness via localhost:6380.
  redis:
    image: redis:7-alpine
    container_name: agent-playground-redis
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
